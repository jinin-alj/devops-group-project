services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\"
      -Q \"IF DB_ID(N'wardrobe') IS NULL CREATE DATABASE wardrobe;
      IF DB_ID(N'outfit') IS NULL CREATE DATABASE outfit\"
      "

  wardrobe:
    build: ./services/wardrobe
    ports:
      - "8001:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      DB_HOST: sqlserver
      DB_NAME: wardrobe
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
      DB_TRUST_SERVER_CERTIFICATE: "yes"

  outfit:
    build: ./services/outfit
    ports:
      - "8002:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      WARDROBE_SERVICE_URL: http://wardrobe:8000
      DATABASE_URL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver,1433;DATABASE=outfit;UID=sa;PWD=${MSSQL_SA_PASSWORD:-LocalDevPassword123!};Encrypt=no"

  ui:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
