name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - wardrobe
          - outfit

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - wardrobe
          - outfit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs:
      - test
      - build-images
    if: always()
    steps:
      - name: Require every CI job
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.build-images.result }}" = "success"
