name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd
  cancel-in-progress: false

env:
  PREFIX: ${{ vars.AZURE_PREFIX }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  push-images:
    name: Push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        service:
          - wardrobe
          - outfit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.name }}

  deploy-services:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: push-images
    strategy:
      matrix:
        service:
          - wardrobe
          - outfit

    steps:
      - name: Log in to Azure (OIDC, no password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image
        run: |
          app="${PREFIX}-${{ matrix.service }}"
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n "$app" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}:${GITHUB_SHA}" \
            --only-show-errors >/dev/null
          az containerapp ingress update -g "$RESOURCE_GROUP" -n "$app" --target-port 8000 \
            --only-show-errors >/dev/null

      # Migrations run on startup, so a 200 here also means they were applied.
      # The wait covers a cold start from zero replicas and a paused database.
      - name: Check /health
        run: |
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "${PREFIX}-${{ matrix.service }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 15 "https://${fqdn}/health"; then
              echo
              echo "Healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Attempt ${attempt}: not healthy yet"
            sleep 10
          done
          echo "::error::${{ matrix.service }} did not return 200 on /health in time"
          exit 1

  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest
    needs: deploy-services

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the UI at the Azure services
        run: |
          fqdn() {
            az containerapp show -g "$RESOURCE_GROUP" -n "${PREFIX}-$1" \
              --query properties.configuration.ingress.fqdn -o tsv
          }
          {
            echo "window.APP_CONFIG = {"
            echo "  wardrobeUrl: \"https://$(fqdn wardrobe)\","
            echo "  outfitUrl: \"https://$(fqdn outfit)\","
            echo "};"
          } > ui/config.js

      - name: Get deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list -g "$RESOURCE_GROUP" -n "${PREFIX}-ui" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::${token}"
          echo "value=${token}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: ui
          skip_app_build: true
          skip_api_build: true
